# Render Blueprint — 在 Render 後台選 New → Blueprint，指向這個 repo 即可。
services:
  - type: web
    name: city-taichung
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: city-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: ENABLE_DEBUG
        value: "false"

databases:
  - name: city-db
    plan: free
    region: singapore
    databaseName: city
    user: city
